name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Compilación, lint y pruebas JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configuración Android y Firebase de pruebas
        run: |
          python3 scripts/ci-firebase.py
      - name: Verificar el proyecto
        run: bash ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Adjuntar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalendu-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Adjuntar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: kalendu-debug-ci
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    name: Pruebas en Android API 35
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Habilitar acceso a KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar configuración local
        run: |
          python3 scripts/ci-firebase.py
      - name: Ejecutar pruebas de pantallas y recordatorios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Adjuntar resultados del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalendu-instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

  release:
    name: Distribuir APK firmado
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, instrumented]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validar etiqueta y preparar firma
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::La etiqueta debe seguir el formato v1.2.3."
            exit 1
          }
          test -n "$GOOGLE_SERVICES_JSON" && test -n "$KEYSTORE_BASE64" || {
            echo "::error::Configura Firebase y la clave de firma en el entorno release."
            exit 1
          }
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/release/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kalendu-release.jks"
          {
            echo "KALENDU_KEYSTORE=$RUNNER_TEMP/kalendu-release.jks"
            echo "KALENDU_VERSION_NAME=${GITHUB_REF_NAME#v}"
            echo "KALENDU_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))"
          } >> "$GITHUB_ENV"
      - name: Compilar y verificar firma
        env:
          KALENDU_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KALENDU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KALENDU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --stacktrace :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "KalendU-${GITHUB_REF_NAME}.apk"
          sha256sum "KalendU-${GITHUB_REF_NAME}.apk" > "KalendU-${GITHUB_REF_NAME}.sha256"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "KalendU-${GITHUB_REF_NAME}.apk" "KalendU-${GITHUB_REF_NAME}.sha256" --verify-tag --generate-notes
      - name: Limpiar material de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/kalendu-release.jks" app/src/release/google-services.json
